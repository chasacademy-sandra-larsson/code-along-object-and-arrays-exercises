<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objekt, arrayer och iterationer</title>
  <link rel="stylesheet" href="./css/index.css">
  <!-- Byt filnamn här för att köra en annan övning. Resultatet syns i konsolen (F12). -->
  <script src="./js/01-objekt-grunder.js" defer></script>
</head>
<body>
  <main>
    <h1>Objekt, arrayer och iterationer</h1>
    <p>Öppna konsolen (F12) för att se resultatet. Listorna nedan används i övning 06–08.</p>

    <section aria-labelledby="students-heading">
      <h2 id="students-heading">Studenter</h2>
      <div class="filters">
        <button type="button" id="show-all">Alla</button>
        <button type="button" id="show-top">Bara A</button>
      </div>
      <p id="status" role="status"></p>
      <p id="count" aria-live="polite"></p>
      <ul id="student-list"></ul>
    </section>

    <section aria-labelledby="users-heading">
      <h2 id="users-heading">Användare från API</h2>
      <button type="button" id="reload-users">Ladda om</button>
      <p id="api-status" role="status"></p>
      <ul id="user-list"></ul>
    </section>

    <section aria-labelledby="quiz-heading">
      <h2 id="quiz-heading">Quizfrågor</h2>
      <p id="quiz-status" role="status"></p>
      <ul id="question-list"></ul>
    </section>
  </main>
</body>
</html>
